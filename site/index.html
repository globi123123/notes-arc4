<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>playground. A little place to play.</title>
    <meta
      name="description"
      content="A small library of carefully made browser games: Snake, Block Stacker, 2048, Minesweeper, a motorcycle racer, typing, Sudoku and more. No installs, no accounts."
    />
    <meta name="theme-color" content="#1d1c1a" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before the stylesheets paint, so a light-mode
      // visitor never sees a dark flash. Dark is the default. The key must
      // match THEME_KEY in js/lib/theme.js.
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('playground:theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f4ef');
        }
      })();
    </script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/library.css" />
    <link rel="stylesheet" href="css/game.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div id="app" class="app">
      <noscript>
        <div class="container" style="padding: 4rem 1rem">
          <h1>playground.</h1>
          <p>The games run in your browser and need JavaScript. Please enable it to play.</p>
        </div>
      </noscript>
    </div>
  </body>
</html>
